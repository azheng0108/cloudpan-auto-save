version: '3.8'

services:
  auto_save:
    build:
      context: .
      dockerfile: Dockerfile
    image: auto_save:latest
    container_name: auto_save
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/home/data
      - ./strm:/home/strm
    environment:
      - NODE_ENV=production
      - TZ=Asia/Shanghai
      - PUID=0
      - PGID=0
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

